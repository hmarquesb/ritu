              casa: confirmado
          verbos: [aquece]
          motivo: "Quente para o frio da manhã, feito com o que você tem em casa."
          linhas_base: ["praticas:cha-gengibre-canela"]
          novidade: false
      evitar: []
      incertos: []
      citados:
