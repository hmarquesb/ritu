  - { alimento_id: cardamomo, dias_atras: 2 }
  - { alimento_id: cardamomo, dias_atras: 3 }

rotina:
  - "Almoça fora durante a semana"
  - "Acorda às 5 h às terças"
  - "Janta tarde, depois das 21 h"

padrao:
  estados: [com_frio, agitada]
  item: { tipo: cha }
  ocorrencias: 3

historico:
  - dias_atras: 6
    mensagem: "Bom dia! Levantei com frio e meio agitada, a cabeça já correndo pras coisas do dia. O que eu faço agora de manhã?"
    estados: [com_frio, agitada]
    momento_do_dia: manha
    gunas_buscadas: [quente, estavel]
    saida:
      origem: agente
      resposta: "Bom dia! Com esse frio e essa pressa por dentro, o que mais cai bem agora é algo quentinho e tranquilo. Você tem gengibre e canela em casa, então que tal um chá dos dois? Ferva umas rodelas de gengibre com um pau de canela por alguns minutos, coe e beba morno, devagar, sentada, antes de começar a correria. O calor aquece de dentro para fora e o ritual de parar uns minutos ajuda a assentar. Depois me conta como ficou."
      geral: false
      avisos: []
      explicacao:
        qualidades_do_momento: [frio, movel]
        qualidades_buscadas: [quente, estavel]
      sugestoes:
        - tipo: cha
          pratica_id: cha-gengibre-canela
          titulo: "Chá de gengibre com canela"
          como_fazer: "Ferva rodelas de gengibre com um pau de canela por alguns minutos. Coe e beba morno."
          itens:
