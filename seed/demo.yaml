      resposta: "Que bom que chegou! Para fechar o dia com mais calma, pensei em duas coisas. Para jantar, um arroz bem cozido com abóbora e um fio de ghee: é quentinho, macio e nutre sem pesar, e você tem tudo em casa. Depois, um escalda-pés morno, com calma, os pés na água enquanto o corpo vai baixando o ritmo. Seque bem os pés e calce meias. Amanhã me conta como foi."
