        {
          "uid": "ritu-cota-do-dia",
          "title": "Cota do dia acima de 80%",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max by (modelo) (ritu_llm_cota_usada{janela=\"dia\"}) >= 0.8",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "params": [
                        0
                      ],
                      "type": "gt"
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "A"
                      ]
                    },
                    "reducer": {
                      "params": [],
                      "type": "last"
                    },
                    "type": "query"
                  }
                ],
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "0m",
          "labels": {
            "gravidade": "aviso"
          },
          "annotations": {
            "summary": "Algum modelo passou do limite da cota diária: confira a cota por modelo antes que ela acabe."
          }
        },
