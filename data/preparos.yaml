# Preparos (pratos) da base — schema em src/core/knowledge/schemas.ts
- id: mingau
  nome: Mingau
  titulo: "Mingau de {base} com {tempero}"
  vagas:
    - { funcao: base, obrigatoria: true, grupos: [graos] }
    - { funcao: gordura, obrigatoria: false, grupos: [oleos, oleaginosas] }
    - { funcao: tempero, obrigatoria: false, maximo: 2, grupos: [especiarias] }
    - { funcao: adocante, obrigatoria: false, grupos: [adocantes] }
  gunas_do_preparo: [quente, suave, oleoso]
  passos: "Aquecer {gordura} na panela e soltar o aroma de {tempero}. Juntar {base} e cozinhar em fogo baixo com bastante água, mexendo, até ficar macio e cremoso. Servir quente e adoçar com {adocante} já fora do fogo."
  momento: [manha]
  contraindicacoes: []
  fontes:
    - { ref: banyan-mingau-aveia, campos: [vagas, passos] }
    - { ref: banyan-mingau-arroz, campos: [passos, gunas_do_preparo] }
    - { ref: banyan-dieta-vata, campos: [vagas, momento, gunas_do_preparo] }
  confianca: media

- id: sopa
  nome: Sopa de legumes
  titulo: "Sopa de {legume} com {tempero}"
  vagas:
    - { funcao: legume, obrigatoria: true, maximo: 3 }
    - { funcao: base, obrigatoria: false, grupos: [raizes, graos] }
    - { funcao: gordura, obrigatoria: false, grupos: [oleos] }
    - { funcao: tempero, obrigatoria: false, maximo: 3, grupos: [especiarias] }
  gunas_do_preparo: [quente, oleoso, suave]
  passos: "Aquecer {gordura} e refogar {tempero} até soltar o aroma. Juntar {legume} e {base} em pedaços, cobrir com água e cozinhar em fogo baixo até tudo ficar bem macio. Servir quente."
  momento: [almoco, jantar]
  contraindicacoes: []
  fontes:
    - { ref: ayurveda-com-sopa-legumes-inverno, campos: [vagas, passos] }
    - { ref: banyan-dieta-vata, campos: [momento, gunas_do_preparo] }
  confianca: media

- id: sopa-creme
  nome: Sopa creme
  titulo: "Creme de {legume} com {tempero}"
  vagas:
    - { funcao: legume, obrigatoria: true, maximo: 2 }
    - { funcao: base, obrigatoria: false, grupos: [raizes] }
    - { funcao: gordura, obrigatoria: false, grupos: [oleos] }
    - { funcao: tempero, obrigatoria: false, maximo: 3, grupos: [especiarias] }
  gunas_do_preparo: [quente, suave, oleoso]
  passos: "Refogar {tempero} em {gordura}. Juntar {legume} e {base} em pedaços, cobrir com água e cozinhar até amaciar. Bater parte da sopa até ficar cremosa, voltar à panela, misturar e servir quente."
  momento: [almoco, jantar]
  contraindicacoes: []
  fontes:
    - { ref: ayurveda-com-sopa-couve-flor, campos: [vagas, passos, gunas_do_preparo] }
    - { ref: banyan-sopa-cenoura-gengibre, campos: [vagas, passos] }
    - { ref: banyan-dieta-vata, campos: [momento] }
  confianca: media

- id: caldo
  nome: Caldo de legumes
