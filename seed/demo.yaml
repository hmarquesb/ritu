  - { alimento_id: arroz-branco, dias_atras: 40, sempre_tenho: true }
  - { alimento_id: canela, dias_atras: 60, sempre_tenho: true }
  - { alimento_id: ghee, dias_atras: 10 }
  - { alimento_id: cominho, dias_atras: 20 }
  - { alimento_id: erva-doce, dias_atras: 30 }
  - { alimento_id: limao, dias_atras: 2 }
  - { alimento_id: aveia, dias_atras: 7 }
  # Incertos (acima da validade: curta 5 dias, média 14 dias)
  - { alimento_id: couve, dias_atras: 8 }
  - { alimento_id: banana, dias_atras: 7 }
  - { alimento_id: leite, dias_atras: 20 }

preferencias:
  - { tipo: alimento, id: canela, gosto: gosta }
  - { tipo: alimento, id: abobora, gosto: gosta }
  - { tipo: alimento, id: quiabo, gosto: nao_gosta }
  - { tipo: pratica, id: cha-gengibre-canela, ajudou: 3 }
  - { tipo: pratica, id: escalda-pes-morno, ajudou: 1 }
  - { tipo: pratica, id: cha-camomila, nao_ajudou: 1 }

faltas:
