name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria
        run: npx --yes audit-ci@7.1.0 --config audit-ci.jsonc

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Duplicação
        run: npm run dup

      - name: Build
        run: npm run build

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Evals determinísticos
        run: npm run eval:det -- --reporter=default --reporter=json --outputFile.json=.vitest/eval-det.json

      - name: Resumo dos evals determinísticos
        if: always()
        run: npm run --silent eval:det:resumo >> "$GITHUB_STEP_SUMMARY"

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ritu
          POSTGRES_PASSWORD: ritu
          POSTGRES_DB: ritu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ritu -d ritu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ritu:ritu@localhost:5432/ritu
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Migrações
        run: npm run db:migrate

      - name: Testes de banco
        run: npm run test:db

  deploy:
    needs: [gates, db]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: producao
    concurrency: { group: producao, cancel-in-progress: false }
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Base sem a_confirmar
        run: npm run base:check -- --producao

      - name: Variáveis na Vercel
        run: npm run env:producao
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Migrações
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRETA }}

      - name: Deploy
        id: deploy
        run: npx vercel@65.17.0 deploy --prod --yes --token "$VERCEL_TOKEN" --env RITU_VERSAO=${{ github.sha }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Smoke
        run: npm run smoke -- "${{ vars.SITE_URL }}"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RITU_VERSAO_ESPERADA: ${{ github.sha }}

      - name: Voltar ao deploy anterior
        if: failure() && steps.deploy.outcome == 'success'
        run: npx vercel@65.17.0 rollback --token "$VERCEL_TOKEN" --non-interactive
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
