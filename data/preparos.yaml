  momento: [manha, jantar]
  contraindicacoes: []
  fontes:
    - { ref: banyan-mingau-arroz, campos: [vagas, passos, gunas_do_preparo] }
    - { ref: banyan-dieta-vata, campos: [momento] }
  confianca: media

- id: arroz-com-legume
  nome: Arroz bem cozido com legume
  titulo: "Arroz bem cozido com {legume} e {gordura}"
