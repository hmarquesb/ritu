name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Duplicação
        run: npm run dup

      - name: Build
        run: npm run build

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Evals determinísticos
        run: npm run eval:det -- --reporter=default --reporter=json --outputFile.json=.vitest/eval-det.json

      - name: Resumo dos evals determinísticos
        if: always()
        run: npm run --silent eval:det:resumo >> "$GITHUB_STEP_SUMMARY"

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ritu
          POSTGRES_PASSWORD: ritu
          POSTGRES_DB: ritu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ritu -d ritu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ritu:ritu@localhost:5432/ritu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Migrações
        run: npm run db:migrate

      - name: Testes de banco
        run: npm run test:db
