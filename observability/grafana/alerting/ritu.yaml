              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "(sum(increase(ritu_run_passos_count{status=\"failed\"}[1h])) / sum(increase(ritu_run_passos_count[1h]))) >= 0.1 and sum(increase(ritu_run_passos_count[1h])) >= 5",
