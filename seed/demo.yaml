  cidade: { nome: Rio de Janeiro, lat: -22.91, lon: -43.21, fuso: America/Sao_Paulo }
  evitar_sempre:
    - { tipo: grupo, valor: castanhas }
  restricoes: []
  nao_come: []

casa:
