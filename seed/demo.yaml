      resposta: "Pode repetir, sim! Da última vez o chá de gengibre com canela caiu bem, e hoje a manhã pede o mesmo calor. Ferva o gengibre em rodelas com a canela, coe e tome morno. Se der, beba antes de olhar a lista: uns minutos parada com a xícara nas mãos já ajudam a desacelerar. Me conta depois se ajudou de novo."
