# Preparos (pratos) da base — schema em src/core/knowledge/schemas.ts
- id: mingau
  nome: Mingau
  titulo: "Mingau de {base} com {tempero}"
  vagas:
    - {
        funcao: base,
        obrigatoria: true,
        alimentos: [arroz-branco, arroz-integral, aveia, quinoa, canjica],
      }
    - { funcao: liquido, obrigatoria: true, alimentos: [leite, leite-de-coco, agua-de-coco] }
    - { funcao: gordura, obrigatoria: false, grupos: [oleos, oleaginosas] }
    - {
        funcao: tempero,
        obrigatoria: false,
        maximo: 2,
        alimentos:
          [
            gengibre,
            canela,
            cardamomo,
            erva-doce,
            curcuma,
            pimenta-do-reino,
            cravo,
            noz-moscada,
            anis-estrelado,
          ],
      }
    - { funcao: adocante, obrigatoria: false, grupos: [adocantes] }
  gunas_do_preparo: [quente, suave, oleoso]
  passos: "Se tiver, aquecer {gordura} na panela. Se quiser, soltar o aroma de {tempero}. Juntar {base} e bastante {liquido} e cozinhar em fogo baixo, mexendo, até o mingau ficar macio e cremoso. Servir quente. Se quiser, adoçar com {adocante} já fora do fogo."
  momento: [manha]
  contraindicacoes: []
  fontes:
    - { ref: banyan-mingau-aveia, campos: [vagas, passos] }
    - { ref: banyan-mingau-arroz, campos: [passos, gunas_do_preparo] }
    - { ref: banyan-dieta-vata, campos: [vagas, momento, gunas_do_preparo] }
  confianca: media

