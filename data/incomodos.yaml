# Incômodos e variantes — schema em src/core/knowledge/schemas.ts
- id: dor-de-cabeca
  nome: Dor de cabeça
  palavras: [dor de cabeça, cabeça doendo, dor na cabeça, cabeça latejando, cabeça pesada, enxaqueca]
  pergunta: "Como está essa dor de cabeça?"
  variantes:
    - id: latejante
      opcao: "Latejante, com calor ou irritação"
      presentes: [quente, intenso]
      favorecer: [frio, brando]
      evitar_gunas: [quente, intenso]
      evitar_marcas: []
      evitar_texto: "picantes, frituras e sol forte"
    - id: tensa
      opcao: "Tensa, com cansaço, ansiedade ou sono ruim"
      presentes: [movel, seco]
      favorecer: [estavel, oleoso, quente]
      evitar_gunas: [movel, frio]
      evitar_marcas: [estimulante]
      evitar_texto: "jejum longo, café e gelados"
    - id: pesada
      opcao: "Pesada, com nariz entupido"
      presentes: [pesado, oleoso]
      favorecer: [leve, quente]
      evitar_gunas: [pesado, frio]
      evitar_marcas: []
      evitar_texto: "laticínios, doces e gelados"
  fontes:
    - { ref: a_confirmar, campos: [variantes] }
  confianca: baixa
