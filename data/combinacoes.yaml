# Combinações de alimentos — schema em src/core/knowledge/schemas.ts
- id: leite-com-fruta-azeda
  itens: ["alimento:leite", "marca:fruta_azeda"]
  motivo: "O leite pede mais tempo para digerir, e o Ayurveda desaconselha tomá-lo com alimentos azedos."
  fontes:
    - { ref: ayurveda-com-combinacao-alimentos, campos: [itens, motivo] }
    - { ref: banyan-leite, campos: [itens] }
  confianca: alta
- id: leite-com-banana
  itens: ["alimento:leite", "alimento:banana"]
  motivo: "Leite e banana estão entre as combinações mais difíceis de digerir; melhor em horários diferentes."
